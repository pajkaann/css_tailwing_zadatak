<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KUB | Prijave</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-200 text-gray-800">
    
    <header class="text-white sticky top-0 bg-gray-900 border-b border-black">
        <div class="max-w-5xl mx-auto px-4 py-6 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-white">KUB</a>
            <nav class="hidden md:flex gap-6">
                <a href="index.html" class="hover:text-gray-300">Naslovnica</a>
                <a href="rides.html" class="hover:text-gray-300">Vožnje</a>
                <a href="enroll.html" class="hover:text-gray-300">Prijave</a>
            </nav>
        </div>
    </header>

    <nav class="md:hidden bg-gray-900 border-b border-black">
        <div class="flex justify-around py-2 text-sm">
            <a href="index.html" class="hover:text-gray-300">Naslovnica</a>
            <a href="rides.html" class="hover:text-gray-300">Vožnje</a>
            <a href="enroll.html" class="hover:text-gray-300">Prijave</a>
        </div>
    </nav>

    <section class="max-w-2xl mx-auto px-4 py-12">
        <h1 class="text-2xl font-bold mb-6">Prijave u KUB</h1>

        <form flex flex-col gap-4>

            <div class="flex flex-col md:flex-row gap-4">

                <div class="flex flex-col gap-2 w-full">
                    <label for="name" class="text-sm font-medium">Ime i prezime</label>
                    <input type="text" id="name" name="name" 
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none">
                </div>

                <div class="flex flex-col gap-2 w-full">
                    <label for="email" class="text-sm font-medium">E-mail adresa</label>
                    <input type="email" id="email" name="email" 
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none">
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="message" class="text-sm font-medium">Koji tečaj te zanima?</label>
                <textarea id="message" name="message" rows="4"
                    class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focus:outline-none"></textarea>
            </div>

            <button type="submit" 
                class="bg-blue-800 text-white border border-black font-semibold px-6 py-4 rounded-lg hover:bg-blue-500">
                Pošalji prijavu
            </button>
        </form>

    </section>

    <footer class="bg-gray-900 text-white">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-4 text-sm">
            <p>Trg bicikla 24, Križevci </p>
            <p>&copy;Križevačka udruga biciklista</p>
            <p>Radnim danom 16 - 21</p>
        </div>
    </footer>

</body>
</html>
